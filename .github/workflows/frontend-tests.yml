name: Frontend Tests

on:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ether/etherpad-lite
          path: etherpad-lite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - uses: actions/checkout@v7
        with:
          path: plugin
      - name: Install Etherpad dependencies
        working-directory: etherpad-lite
        run: bin/installDeps.sh
      - name: Install plugin
        working-directory: etherpad-lite
        run: pnpm run plugins i --path ../../plugin
      - name: Create test settings
        working-directory: etherpad-lite
        run: |
          node <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('src/tests/settings.json', 'utf8'));
          settings.ep_webrtc = {enabled: false};
          fs.writeFileSync('settings.json', JSON.stringify(settings));
          NODE
      - name: Install browser
        working-directory: etherpad-lite/src
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Etherpad
        working-directory: etherpad-lite
        run: pnpm run dev > etherpad.log 2>&1 &
      - name: Wait for Etherpad
        run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 90 --max-time 3 http://localhost:9001/health
      - name: Run frontend tests
        working-directory: etherpad-lite/src
        run: pnpm run test-ui --project=chromium
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: |
            etherpad-lite/etherpad.log
            etherpad-lite/src/test-results
