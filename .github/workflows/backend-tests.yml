name: Backend Tests

on:
  workflow_call:

jobs:
  withplugins:
    name: with Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ether/etherpad-lite
          path: etherpad-lite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libreoffice
          version: 1.0
      - uses: actions/checkout@v7
        with:
          path: plugin
      - name: Install Etherpad dependencies
        working-directory: etherpad-lite
        run: bin/installDeps.sh
      - name: Build admin UI
        working-directory: etherpad-lite/admin
        run: pnpm build
      - name: Install plugin
        working-directory: etherpad-lite
        run: pnpm run plugins i --path ../../plugin
      - name: Create test settings
        working-directory: etherpad-lite
        run: |
          node <<'NODE'
          const fs = require('fs');
          const settings = JSON.parse(fs.readFileSync('src/tests/settings.json', 'utf8'));
          settings.ep_webrtc = {enabled: false};
          settings.soffice = '/usr/bin/soffice';
          fs.writeFileSync('settings.json', JSON.stringify(settings));
          NODE
      - name: Run backend tests with the plugin installed
        shell: bash
        working-directory: etherpad-lite
        run: pnpm test 2>&1 | tee backend-tests.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: etherpad-lite/backend-tests.log
