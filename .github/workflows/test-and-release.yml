name: Tests and Release

on: [push]

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend-tests.yml
    secrets: inherit
  frontend:
    uses: ./.github/workflows/frontend-tests.yml
    secrets: inherit
  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e-tests.yml
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const {version} = require('./package.json');
          if (!/^[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$/.test(version)) {
            throw new Error('Version must use YYYY.M.N without leading zeroes');
          }
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Tag and package version must match');
          }
          NODE
      - name: Create draft source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
