name: E2E Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  menu-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install notebook and browser dependencies
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build test image
        run: docker compose -p ep-webrtc-e2e -f tests/e2e/docker-compose.yml build --pull omitted
      - name: Start Etherpad configurations
        run: docker compose -p ep-webrtc-e2e -f tests/e2e/docker-compose.yml up -d --no-build --wait --wait-timeout 120
      - name: Check menu visibility
        run: python tests/e2e/run_notebooks.py
      - name: Collect server logs
        if: always()
        run: |
          mkdir -p tests/e2e/artifacts
          docker compose -p ep-webrtc-e2e -f tests/e2e/docker-compose.yml logs --no-color > tests/e2e/artifacts/docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-visibility-results
          path: tests/e2e/artifacts
      - name: Stop services
        if: always()
        run: docker compose -p ep-webrtc-e2e -f tests/e2e/docker-compose.yml down -v
